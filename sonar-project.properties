sonar.projectKey=contact-manager
sonar.projectName=Contact Manager
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

sonar.exclusions=**/node_modules/**,backend/target/**,frontend/dist/**,frontend/build/**,**/coverage/**
sonar.test.inclusions=backend/src/test/java/**/*.java,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/*.spec.js,frontend/src/**/*.spec.jsx
sonar.coverage.exclusions=backend/src/test/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/*.spec.js,frontend/src/**/*.spec.jsx
